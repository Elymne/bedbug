name: Deploy Flutter Web to Firebase Preprod

on:
  push:
    tags: ["[0-9]+\\.[0-9]+\\.[0-9]+"]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.7"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build web
        run: |
          flutter build web --release --dart-define=ENV=production

      - name: Create Firebase credentials file
        run: echo '${{ secrets.FIREBASE_CREDENTIALS_PREPROD }}' > firebase-prod.json

      - name: Set GOOGLE_APPLICATION_CREDENTIALS
        run: echo "GOOGLE_APPLICATION_CREDENTIALS=$PWD/firebase-prod.json" >> $GITHUB_ENV

      - name: Deploy to Firebase (Prod)
        run: npx firebase-tools@15.11.0 deploy --only hosting:prod --project survey-app-697a5
